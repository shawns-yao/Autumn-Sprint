name: autumn-sprint

services:
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: "8787"
      APP_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env}
      DB_PATH: /app/data/autumn-sprint.sqlite
      AI_API_KEY: ${AI_API_KEY:-}
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?Set BASIC_AUTH_USER in .env}
      BASIC_AUTH_PASSWORD_HASH: ${BASIC_AUTH_PASSWORD_HASH:?Set BASIC_AUTH_PASSWORD_HASH in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  app_data:
  caddy_data:
  caddy_config:
